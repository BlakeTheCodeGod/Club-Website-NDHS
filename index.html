<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding Club</title>
  <meta name="description" content="Our school's coding club. Built by its members.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Coding Club</a>
    <nav aria-label="Main">
      <a href="#members">Members</a>
      <a href="#meetings">Meetings</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>This website was built by <span id="member-count">our</span> members.</h1>
      <p>Join Coding Club today. Email blake.westin.2029@ndhs.org for details.</p>
      <p class="when" id="when"></p>
      <img src="images/athletics_monogram1-removebg-preview.png" alt="Club members at a meeting" class="hero-img">
    </section>

    <section id="members" aria-labelledby="members-h">
      <h2 id="members-h">Members</h2>
      <ul class="wall" id="member-list"></ul>
    </section>

    <section id="meetings" aria-labelledby="meetings-h">
      <h2 id="meetings-h">Meetings</h2>
      <ul class="meetings" id="meeting-list"></ul>
    </section>
  </main>

  <footer>
    <p>Made with HTML, CSS, and JavaScript by the Coding Club. Assisted by Claude</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
